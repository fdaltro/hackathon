name: Terraform Destroy

on:
  workflow_dispatch: # Este é o gatilho para execução manual via painel do GitHub

jobs:
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    env:
      TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
      TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_region: ${{ secrets.AWS_REGION }}
      TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
      TF_VAR_datadog_app_key: ${{ secrets.DATADOG_APP_KEY }}
      TF_VAR_datadog_site: "us5.datadoghq.com"
      TF_VAR_pagerduty_integration_key: ${{ secrets.PAGERDUTY_INTEGRATION_KEY }}

    defaults:
      run:
        working-directory: ./solidary-terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        # O -reconfigure garante que a pipeline sempre inicie fresca sem conflitos de cache
        run: terraform init -reconfigure

      # Remove Ingress, ValidatingWebhookConfiguration do ingress-nginx e
      # LoadBalancers órfãos ANTES do destroy - mesma causa raiz documentada
      # no dr-destroy.yml: o webhook do ingress-nginx trava a exclusão do
      # Ingress "solidary-ingress" (namespace solidary) quando o Service que
      # o atende já não existe, deixando os namespaces presos em Terminating
      # e o terraform destroy falhando por timeout.
      - name: Remover Ingress, Webhooks e Services órfãos
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name solidary-eks || true
          kubectl delete ingress --all --all-namespaces --timeout=60s || true
          kubectl delete validatingwebhookconfiguration ingress-nginx-admission --ignore-not-found=true
          kubectl delete mutatingwebhookconfiguration ingress-nginx-admission --ignore-not-found=true
          kubectl delete svc --all -n ingress-nginx --timeout=60s || true
          kubectl delete svc --all -n argocd --timeout=60s || true
          kubectl delete svc --all -n observabilidade --timeout=60s || true
          echo "Aguardando a AWS liberar os ELBs (30s)..."
          sleep 30

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
