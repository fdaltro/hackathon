name: "🚨 DR - Destruir Infraestrutura de Oregon (Rollback/Cleanup)"

on:
  workflow_dispatch: # Botão de clique único no GitHub Actions

jobs:
  destroy-dr:
    name: "Executar Terraform Destroy em us-west-2"
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do repositório para o runner
    - name: Checkout do Código
      uses: actions/checkout@v4

    # 2. Configura as credenciais da AWS utilizando os Secrets do GitHub
    - name: Configurar Credenciais AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-west-2

    # 3. Instala o Terraform no Runner
    - name: Instalar Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.9.0"

    # 4. Reconfigura o backend do Terraform apontando para o bucket de state em Oregon
    - name: Reconfigurar Backend do Terraform para Região de DR
      working-directory: solidary-terraform
      run: |
        terraform init -reconfigure \
          -backend-config="bucket=solidary-tech-tfstate-dr-158176292469" \
          -backend-config="key=dr/terraform.tfstate" \
          -backend-config="region=us-west-2"

    # 5. Remove Ingress, ValidatingWebhookConfiguration do ingress-nginx e
    #    LoadBalancers órfãos ANTES do destroy.
    #
    #    CAUSA RAIZ (namespaces presos em Terminating): o ingress-nginx é
    #    instalado com admissionWebhooks habilitado, criando uma
    #    ValidatingWebhookConfiguration cluster-scoped que intercepta
    #    toda exclusão de objetos "Ingress" (ex: solidary-ingress, no
    #    namespace "solidary"). Se apagarmos só o Service do
    #    ingress-nginx (como antes) e deixarmos o webhook vivo, o
    #    apiserver tenta chamar o webhook para validar a exclusão do
    #    Ingress durante a finalização do namespace, não recebe resposta
    #    (o backend já não existe) e, como failurePolicy=Fail é o padrão
    #    do chart, a exclusão do Ingress trava para sempre - o que deixa
    #    o namespace "solidary" (e por consequência o restante do
    #    destroy) preso em Terminating. Por isso apagamos o Ingress e o
    #    webhook diretamente, e só depois os Services (mesmo problema já
    #    visto em us-east-1 com ELBs do ArgoCD/Grafana/Ingress).
    - name: Remover Ingress, Webhooks e Services órfãos
      run: |
        aws eks update-kubeconfig --region us-west-2 --name solidary-eks || true
        kubectl delete ingress --all --all-namespaces --timeout=60s || true
        kubectl delete validatingwebhookconfiguration ingress-nginx-admission --ignore-not-found=true
        kubectl delete mutatingwebhookconfiguration ingress-nginx-admission --ignore-not-found=true
        kubectl delete svc --all -n ingress-nginx --timeout=60s || true
        kubectl delete svc --all -n argocd --timeout=60s || true
        kubectl delete svc --all -n observabilidade --timeout=60s || true
        echo "Aguardando a AWS liberar os ELBs (30s)..."
        sleep 30

    # 6. Executa o destroy automatizado da infraestrutura em us-west-2
    - name: Executar Terraform Destroy
      working-directory: solidary-terraform
      run: |
        terraform destroy -var="region=us-west-2" -auto-approve
        echo "🧹 Infraestrutura de DR em Oregon destruída com sucesso. Os buckets S3 permanecem intactos."
      env:
        TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        TF_VAR_aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
        TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
        TF_VAR_datadog_app_key: ${{ secrets.DATADOG_APP_KEY }}
        TF_VAR_datadog_site: "us5.datadoghq.com"
        TF_VAR_pagerduty_integration_key: ${{ secrets.PAGERDUTY_INTEGRATION_KEY }}
