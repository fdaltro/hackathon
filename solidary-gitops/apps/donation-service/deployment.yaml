apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation-service
  namespace: solidary
  labels:
    app: donation-service
spec:
  replicas: 2 # Iniciando com 2 pods para alta disponibilidade
  selector:
    matchLabels:
      app: donation-service
  template:
    metadata:
      labels:
        app: donation-service
    spec:
      containers:
      - name: donation-service
        # Nome curto - o Kustomize substitui pelo path completo do ECR + tag do commit
        image: donation-service
        ports:
        - containerPort: 8082
        envFrom:
        - configMapRef:
            name: donation-config
        - secretRef:
            name: donation-secret
        - secretRef:
            name: aws-credentials # Injeta chaves para ler a fila SQS

        # ---> ENV PARA O OPENTELEMETRY <---
        # COMENTADO: o module.observability (otel-collector) ainda não foi
        # provisionado no Terraform. Descomente quando o coletor estiver
        # rodando no namespace "observabilidade", senão a app vai tentar
        # exportar traces para um endpoint que não existe.
        # env:
        # - name: OTEL_SERVICE_NAME
        #   value: "donation-service"
        # - name: OTEL_EXPORTER_OTLP_ENDPOINT
        #   value: "http://otel-collector.observabilidade.svc.cluster.local:4317"
        # - name: OTEL_EXPORTER_OTLP_INSECURE
        #   value: "true"
        # - name: OTEL_EXPORTER_OTLP_PROTOCOL
        #   value: "grpc"
        # - name: OTEL_RESOURCE_ATTRIBUTES
        #   value: "deployment.environment=production,service.version=1.0.0"
        # - name: OTEL_PROPAGATORS
        #   value: "tracecontext,baggage"

        resources:
          requests:
            cpu: "50m" # Go é leve e consome pouca CPU base (FinOps)
            memory: "64Mi"
          limits:
            cpu: "150m"
            memory: "128Mi"

        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 20
