apiVersion: v1
kind: ConfigMap
metadata:
  name: donation-db-init-sql
  namespace: solidary
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS donations (
        id SERIAL PRIMARY KEY,
        ngo_id INT NOT NULL,
        amount NUMERIC(10, 2) NOT NULL,
        donor_name VARCHAR(100) NOT NULL,
        status VARCHAR(20) NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
---
apiVersion: batch/v1
kind: Job
metadata:
  name: donation-db-setup
  namespace: solidary
  annotations:
    # Roda ANTES do deployment do donation-service ser sincronizado pelo ArgoCD
    argocd.argoproj.io/hook: PreSync
    # Remove o Job antigo automaticamente antes de criar um novo (Jobs são imutáveis)
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      containers:
      - name: db-init
        image: postgres:15-alpine
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: donation-secret
              key: DATABASE_URL
        command: ["/bin/sh", "-c", "psql $DATABASE_URL -f /scripts/init.sql"]
        volumeMounts:
        - name: sql-volume
          mountPath: /scripts
      volumes:
      - name: sql-volume
        configMap:
          name: donation-db-init-sql
      restartPolicy: OnFailure
