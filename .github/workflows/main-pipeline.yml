name: Main Pipeline - Microservices Build & Push

# ============================================================
# Dispara sempre que algo em solidary-microservices/ for
# alterado na branch main (push) ou em Pull Requests.
# ============================================================
on:
  push:
    branches: [main]
    paths:
      - "solidary-microservices/**"
  pull_request:
    branches: [main]
    paths:
      - "solidary-microservices/**"
  workflow_dispatch: {} # Permite rodar manualmente pela aba Actions

env:
  AWS_REGION: us-east-1
  # Precisa bater exatamente com o nome gerado pelo módulo Terraform:
  # name = "${var.project_name}-${each.value}" -> "solidary-tech-<service>"
  PROJECT_NAME: solidary-tech

jobs:
  # ==========================================================
  # JOB 1: Build, Scan de Segurança (DevSecOps) e Push
  # Roda em paralelo para os 3 microsserviços via matrix.
  # Tag usada = SHA do commit (o ECR é IMMUTABLE, ":latest"
  # fixo quebraria no segundo push).
  # ==========================================================
  build-scan-push:
    name: Build & Push - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [ngo-service, donation-service, volunteer-service]

    permissions:
      contents: read
      security-events: write # necessário para publicar o relatório do Trivy

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build da imagem Docker
        working-directory: solidary-microservices/${{ matrix.service }}
        run: |
          docker build \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ matrix.service }}:${{ github.sha }} \
            .

      # ==========================================================
      # DevSecOps: Scan de vulnerabilidades com Trivy (SAST/SCA)
      # Não bloqueia o pipeline (exit-code 0), mas publica o
      # relatório na aba "Security" do repositório no GitHub.
      # ==========================================================
      - name: Scan de segurança com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ matrix.service }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results-${{ matrix.service }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Troque para "1" se quiser que vulnerabilidades CRÍTICAS bloqueiem o build

      - name: Publicar resultado do Trivy no GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results-${{ matrix.service }}.sarif"
          category: "trivy-${{ matrix.service }}"

      # ==========================================================
      # Push só acontece em push para main (não em Pull Requests)
      # Apenas a tag do commit é publicada - sem ":latest", já
      # que o repositório ECR é IMMUTABLE.
      # ==========================================================
      - name: Push da imagem para o ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: solidary-microservices/${{ matrix.service }}
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ matrix.service }}:${{ github.sha }}

      - name: Resumo do Job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "### 🚀 Imagem publicada" >> $GITHUB_STEP_SUMMARY
          echo "- **Serviço:** ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================
  # JOB 2: Atualiza o kustomization.yaml de cada serviço com a
  # nova tag (SHA do commit) e comita de volta no repositório.
  # O ArgoCD (automated.selfHeal=true) detecta a mudança no Git
  # e sincroniza o cluster automaticamente - fluxo GitOps completo.
  #
  # Roda uma única vez, depois que os 3 builds da matrix
  # terminarem, para evitar commits concorrentes conflitantes.
  # ==========================================================
  update-gitops-manifests:
    name: Atualizar manifestos GitOps
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write # necessário para o commit/push de volta ao repo

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Descobrir registry do ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Atualizar tag da imagem em cada serviço
        run: |
          set -e
          for service in ngo-service donation-service volunteer-service; do
            IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-${service}"
            echo "Atualizando $service -> $IMAGE:${{ github.sha }}"
            # O deployment.yaml usa o nome curto (ex: "ngo-service") como
            # placeholder de imagem - o kustomize casa por esse nome e
            # substitui pelo path completo do ECR + tag do commit.
            (cd "solidary-gitops/apps/${service}" && kustomize edit set image "${service}=${IMAGE}:${{ github.sha }}")
          done

      - name: Commit e push das mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Nenhuma mudança para commitar."
            exit 0
          fi

          git add solidary-gitops/apps/*/kustomization.yaml
          git commit -m "ci: atualiza imagens para o commit ${{ github.sha }} [skip ci]"
          git push

      - name: Resumo
        run: |
          echo "### 🔄 Manifestos GitOps atualizados" >> $GITHUB_STEP_SUMMARY
          echo "O ArgoCD deve sincronizar automaticamente em instantes." >> $GITHUB_STEP_SUMMARY
