name: Main Pipeline - Microservices Build & Push

# ============================================================
# Dispara sempre que algo em solidary-microservices/ for
# alterado na branch main (push) ou em Pull Requests.
# ============================================================
on:
  push:
    branches: [main]
    paths:
      - "solidary-microservices/**"
  pull_request:
    branches: [main]
    paths:
      - "solidary-microservices/**"
  workflow_dispatch: {} # Permite rodar manualmente pela aba Actions

env:
  AWS_REGION: us-east-1
  # Precisa bater exatamente com o nome gerado pelo módulo Terraform:
  # name = "${var.project_name}-${each.value}" -> "solidary-tech-<service>"
  PROJECT_NAME: solidary-tech

jobs:
  # ==========================================================
  # JOB 0: Gera a versão/tag usada em todos os jobs seguintes
  # Formato legível: v1.0.0-<7 primeiros chars do commit>
  # ==========================================================
  set-version:
    name: Definir versão
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - id: set
        run: echo "version=v1.0.0-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

  # ==========================================================
  # JOB 1: Lint (qualidade de código) - serviços Python
  # ==========================================================
  lint-python:
    name: Lint - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ngo-service, volunteer-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Linting
        working-directory: solidary-microservices/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # ==========================================================
  # JOB 2: SCA isolado (Trivy fs) - roda ANTES do build
  # Escaneia dependências (requirements.txt / go.mod) cedo,
  # pegando vulnerabilidades conhecidas antes de gastar tempo
  # buildando a imagem.
  # ==========================================================
  sca-scan:
    name: SCA Scan - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ngo-service, donation-service, volunteer-service]
    steps:
      - uses: actions/checkout@v4
      - name: Trivy SCA (dependências)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "solidary-microservices/${{ matrix.service }}"
          format: "table"
          severity: "CRITICAL"
          exit-code: "0" # Não bloqueia o lab - troque para "1" para travar em CVEs críticas

  # ==========================================================
  # JOB 3: Testes unitários - serviços Python
  # (segue o mesmo padrão de fallback do projeto de referência:
  # se não houver testes definidos ainda, não quebra o pipeline)
  # ==========================================================
  test-python:
    name: Testes - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ngo-service, volunteer-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rodar testes
        working-directory: solidary-microservices/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest || echo "Sem testes definidos"

  # ==========================================================
  # JOB 4: Build, Scan de Imagem (DevSecOps) e Push
  # Só roda depois que lint + SCA + testes passarem.
  # Tag usada = versão legível (v1.0.0-<sha curto>) - o ECR é
  # IMMUTABLE, então nunca reutilizamos a mesma tag duas vezes.
  # ==========================================================
  build-scan-push:
    name: Build & Push - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [set-version, lint-python, sca-scan, test-python]

    strategy:
      fail-fast: false
      matrix:
        service: [ngo-service, donation-service, volunteer-service]

    permissions:
      contents: read
      security-events: write # necessário para publicar o relatório do Trivy

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build da imagem Docker
        working-directory: solidary-microservices/${{ matrix.service }}
        run: |
          docker build \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ matrix.service }}:${{ needs.set-version.outputs.version }} \
            .

      # ==========================================================
      # DevSecOps: Scan de vulnerabilidades da imagem final com Trivy
      # Não bloqueia o pipeline (exit-code 0), mas publica o
      # relatório na aba "Security" do repositório no GitHub.
      # ==========================================================
      - name: Scan de segurança com Trivy (imagem)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ matrix.service }}:${{ needs.set-version.outputs.version }}"
          format: "sarif"
          output: "trivy-results-${{ matrix.service }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Troque para "1" se quiser que vulnerabilidades CRÍTICAS bloqueiem o build

      - name: Publicar resultado do Trivy no GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results-${{ matrix.service }}.sarif"
          category: "trivy-${{ matrix.service }}"

      # ==========================================================
      # Push só acontece em push para main (não em Pull Requests)
      # ==========================================================
      - name: Push da imagem para o ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: solidary-microservices/${{ matrix.service }}
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ matrix.service }}:${{ needs.set-version.outputs.version }}

      - name: Resumo do Job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "### 🚀 Imagem publicada" >> $GITHUB_STEP_SUMMARY
          echo "- **Serviço:** ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Versão:** ${{ needs.set-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================
  # JOB 5: Atualiza o kustomization.yaml de cada serviço com a
  # nova versão e comita de volta no repositório. O ArgoCD
  # (automated.selfHeal=true) detecta a mudança no Git e
  # sincroniza o cluster automaticamente - fluxo GitOps completo.
  #
  # Roda uma única vez, depois que os 3 builds da matrix
  # terminarem, para evitar commits concorrentes conflitantes.
  # ==========================================================
  update-gitops-manifests:
    name: Atualizar manifestos GitOps
    runs-on: ubuntu-latest
    needs: [set-version, build-scan-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write # necessário para o commit/push de volta ao repo

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Descobrir registry do ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Atualizar tag da imagem em cada serviço
        run: |
          set -e
          VERSION="${{ needs.set-version.outputs.version }}"
          for service in ngo-service donation-service volunteer-service; do
            IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-${service}"
            echo "Atualizando $service -> $IMAGE:$VERSION"
            # O deployment.yaml usa o nome curto (ex: "ngo-service") como
            # placeholder de imagem - o kustomize casa por esse nome e
            # substitui pelo path completo do ECR + versão.
            (cd "solidary-gitops/apps/${service}" && kustomize edit set image "${service}=${IMAGE}:${VERSION}")
          done

      - name: Commit e push das mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Nenhuma mudança para commitar."
            exit 0
          fi

          git add solidary-gitops/apps/*/kustomization.yaml
          git commit -m "ci: atualiza imagens para ${{ needs.set-version.outputs.version }} [skip ci]"
          git push

      - name: Resumo
        run: |
          echo "### 🔄 Manifestos GitOps atualizados" >> $GITHUB_STEP_SUMMARY
          echo "**Versão:** ${{ needs.set-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "O ArgoCD deve sincronizar automaticamente em instantes." >> $GITHUB_STEP_SUMMARY